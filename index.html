

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Donate Control</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #070b14;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
    background: #101827;
    border: 1px solid #24334b;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 20px 70px #0008;
}

.logo {
    color: #3997ff;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.subtitle {
    color: #8291a8;
    font-size: 14px;
    margin-bottom: 30px;
}

.status-card {
    background: #172438;
    border: 1px solid #293d58;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 20px;
}

.status-label {
    color: #899bb5;
    font-size: 12px;
    margin-bottom: 12px;
}

.status {
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
}

.dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ff4757;
    box-shadow: 0 0 12px #ff4757;
}

.status.active {
    color: #35df99;
}

.status.active .dot {
    background: #35df99;
    box-shadow: 0 0 12px #35df99;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
    margin-bottom: 12px;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

.activate {
    background: #1678ed;
    color: white;
}

.deactivate {
    background: #273449;
    color: white;
}

.history {
    margin-top: 25px;
    border-top: 1px solid #29364a;
    padding-top: 20px;
}

.history h3 {
    font-size: 14px;
    margin-bottom: 15px;
}

#logs {
    color: #8798b1;
    font-size: 12px;
    line-height: 2;
    max-height: 110px;
    overflow-y: auto;
}

.footer {
    margin-top: 25px;
    text-align: center;
    color: #64748b;
    font-size: 11px;
}

.fake {
    color: #f4b942;
    font-size: 10px;
    text-align: center;
    margin-top: 12px;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">SKY SYSTEM</div>

    <h1>Donate Control</h1>
    <p class="subtitle">Painel de gerenciamento de Donate</p>

    <div class="status-card">
        <div class="status-label">STATUS DO DONATE</div>

        <div class="status" id="status">
            <span class="dot"></span>
            <span id="statusText">DESATIVADO</span>
        </div>
    </div>

    <button class="activate" onclick="setDonate(true)">
        ATIVAR DONATE
    </button>

    <button class="deactivate" onclick="setDonate(false)">
        DESATIVAR DONATE
    </button>

    <div class="history">
        <h3>Histórico de atividades</h3>
        <div id="logs">
            Sistema iniciado.
        </div>
    </div>

    <div class="fake">⚠ SIMULAÇÃO — NENHUMA TRANSAÇÃO REAL</div>

    <div class="footer">
        SKY DONATE CONTROL © 2026
    </div>

</div>

<script>
let donateActive = false;

function setDonate(value) {
    if (donateActive === value) return;

    donateActive = value;

    const status = document.getElementById("status");
    const text = document.getElementById("statusText");

    if (value) {
        status.classList.add("active");
        text.textContent = "ATIVADO";
        addLog("Donate ativado com sucesso.");
    } else {
        status.classList.remove("active");
        text.textContent = "DESATIVADO";
        addLog("Donate desativado.");
    }
}

function addLog(message) {
    const logs = document.getElementById("logs");
    const time = new Date().toLocaleTimeString("pt-BR");

    const entry = document.createElement("div");
    entry.textContent = "[" + time + "] " + message;

    logs.prepend(entry);
}
</script>

</body>
</html>
